[project]
name = "t3-usage-monitor"
version = "0.2.0"
description = "Monitor an existing T3 Code server's usage and subscription limits in Home Assistant"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "homeassistant==2026.10.2",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-aiohttp>=1.1",
  "pytest-homeassistant-custom-component==0.13.373",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
